name: LibreEcho browser E2E

on:
  pull_request:
    paths:
      - 'Makefile'
      - 'web/**'
      - 'src/main.c'
      - 'src/http_server.c'
      - 'src/http_server.h'
      - 'src/tls.c'
      - 'src/tls.h'
      - 'src/api.c'
      - 'src/auth.c'
      - 'src/backend*.c'
      - 'config/**'
      - 'tests/e2e/**'
      - '.github/workflows/playwright-e2e.yml'
  push:
    branches:
      - main
    paths:
      - 'Makefile'
      - 'web/**'
      - 'src/main.c'
      - 'src/http_server.c'
      - 'src/http_server.h'
      - 'src/tls.c'
      - 'src/tls.h'
      - 'src/api.c'
      - 'src/auth.c'
      - 'src/backend*.c'
      - 'config/**'
      - 'tests/e2e/**'
      - '.github/workflows/playwright-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium_e2e:
    name: Chromium browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out UI source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install native test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential jq cmake ninja-build

      - name: Build pinned mbedTLS runtime
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/mbedtls-src"
          prefix="$RUNNER_TEMP/mbedtls"
          git clone \
            --depth 1 \
            --branch mbedtls-3.6.4 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/Mbed-TLS/mbedtls.git \
            "$src"
          cmake -S "$src" -B "$src/build" -G Ninja \
            -DENABLE_PROGRAMS=OFF \
            -DENABLE_TESTING=OFF \
            -DUSE_SHARED_MBEDTLS_LIBRARY=OFF \
            -DUSE_STATIC_MBEDTLS_LIBRARY=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build "$src/build"
          cmake --install "$src/build"

      - name: Install pinned Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/libreecho-playwright"
          npm install \
            --prefix "$RUNNER_TEMP/libreecho-playwright" \
            --no-save \
            --no-package-lock \
            playwright@1.55.0
          "$RUNNER_TEMP/libreecho-playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run browser E2E checks
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/libreecho-playwright/node_modules
          CPPFLAGS: -I${{ runner.temp }}/mbedtls/include
          LDFLAGS: -L${{ runner.temp }}/mbedtls/lib
          WEB_TLS_LIBS: -lmbedtls -lmbedx509 -lmbedcrypto
          RADIOD_TLS_LIBS: -lmbedtls -lmbedx509 -lmbedcrypto
        run: |
          set -euo pipefail
          sh tests/e2e/run.sh

  webkit_baby_monitor:
    name: WebKit Baby Monitor playback
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out UI source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install native test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential jq cmake ninja-build

      - name: Build pinned mbedTLS runtime
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/mbedtls-src"
          prefix="$RUNNER_TEMP/mbedtls"
          git clone \
            --depth 1 \
            --branch mbedtls-3.6.4 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/Mbed-TLS/mbedtls.git \
            "$src"
          cmake -S "$src" -B "$src/build" -G Ninja \
            -DENABLE_PROGRAMS=OFF \
            -DENABLE_TESTING=OFF \
            -DUSE_SHARED_MBEDTLS_LIBRARY=OFF \
            -DUSE_STATIC_MBEDTLS_LIBRARY=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build "$src/build"
          cmake --install "$src/build"

      - name: Install pinned Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/libreecho-playwright"
          npm install \
            --prefix "$RUNNER_TEMP/libreecho-playwright" \
            --no-save \
            --no-package-lock \
            playwright@1.55.0
          "$RUNNER_TEMP/libreecho-playwright/node_modules/.bin/playwright" install --with-deps webkit

      # WebKit is the engine iOS Safari uses, so this is the closest host-side
      # stand-in for the reported iPhone failure: the Baby Monitor playback
      # lifecycle runs against the real engine instead of only in Node.
      - name: Run Baby Monitor playback checks under WebKit
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/libreecho-playwright/node_modules
          LIBREECHO_E2E_BROWSER: webkit
          LIBREECHO_E2E_SUITES: baby-monitor
          CPPFLAGS: -I${{ runner.temp }}/mbedtls/include
          LDFLAGS: -L${{ runner.temp }}/mbedtls/lib
          WEB_TLS_LIBS: -lmbedtls -lmbedx509 -lmbedcrypto
          RADIOD_TLS_LIBS: -lmbedtls -lmbedx509 -lmbedcrypto
        run: |
          set -euo pipefail
          sh tests/e2e/run.sh
