name: LibreEcho UI checks

on:
  # Keep the older release lines and everyday development in the local lane,
  # but never treat browser smoke as full source verification for 0.14.
  pull_request:
    branches: ['release/0.14.0']
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: ['release/0.14.0']
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source_checks:
    name: Full source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ESPHOMED_NOISE: '1'
      ESPHOMED_CRYPTO_PYTHON: /usr/bin/python3

    steps:
      - name: Configure private test paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t"
          # runner is unavailable in job-level env; export runtime paths here.
          printf '%s\n' \
            "TMPDIR=$RUNNER_TEMP/t" \
            "ESPHOMED_TLS_PREFIX=$RUNNER_TEMP/mbedtls" \
            "ESPHOMED_TEST_TLS_PREFIX=$RUNNER_TEMP/mbedtls" \
            "ESPHOMED_TLS_LIBS=$RUNNER_TEMP/mbedtls/lib/libmbedtls.a $RUNNER_TEMP/mbedtls/lib/libmbedx509.a $RUNNER_TEMP/mbedtls/lib/libmbedcrypto.a" \
            "CPPFLAGS=-I$RUNNER_TEMP/mbedtls/include" \
            "ESPHOMED_AIO_PYTHON=$RUNNER_TEMP/esphome-client/bin/python" \
            >> "$GITHUB_ENV"

      - name: Check out UI source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Retain exact tracked verification inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          git rev-parse HEAD > "$RUNNER_TEMP/ui-source-commit.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/ui-source.tar.gz"

      - name: Upload short-lived verification inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-verification-inputs
          path: |
            ${{ runner.temp }}/ui-source-commit.txt
            ${{ runner.temp }}/ui-source.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential bubblewrap jq libspeexdsp-dev nodejs \
            cmake ninja-build python3-venv python3-cryptography python3-nacl \
            curl ffmpeg openssl ca-certificates \
            libogg-dev libopus-dev libopusfile-dev

      - name: Build pinned mbedTLS runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          src="$RUNNER_TEMP/mbedtls-src"
          prefix="$RUNNER_TEMP/mbedtls"
          archive="$RUNNER_TEMP/mbedtls-3.6.4.tar.bz2"
          # Same release archive and integrity pin as Platform SOURCE.lock.
          curl --fail --location --retry 3 \
            https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.4/mbedtls-3.6.4.tar.bz2 \
            --output "$archive"
          printf '%s  %s\n' \
            ec35b18a6c593cf98c3e30db8b98ff93e8940a8c4e690e66b41dfc011d678110 \
            "$archive" | sha256sum --check --strict
          mkdir -p "$src"
          tar -xjf "$archive" --strip-components=1 -C "$src"
          python3 -m venv "$RUNNER_TEMP/mbedtls-build-python"
          "$RUNNER_TEMP/mbedtls-build-python/bin/python" -m pip install \
            Jinja2==3.1.6 jsonschema==4.25.1
          cmake -S "$src" -B "$src/build" -G Ninja \
            -DPython3_EXECUTABLE="$RUNNER_TEMP/mbedtls-build-python/bin/python" \
            -DENABLE_PROGRAMS=OFF \
            -DENABLE_TESTING=OFF \
            -DUSE_SHARED_MBEDTLS_LIBRARY=OFF \
            -DUSE_STATIC_MBEDTLS_LIBRARY=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build "$src/build"
          cmake --install "$src/build"

      - name: Install pinned ESPHome native client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/esphome-client"
          "$RUNNER_TEMP/esphome-client/bin/python" -m pip install -r requirements-esphome.txt PyNaCl==1.5.0
          "$RUNNER_TEMP/esphome-client/bin/python" -c 'from importlib.metadata import version; assert version("aioesphomeapi") == "46.2.0"'

      - name: Enable user namespaces for virtual service harness
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      - name: Stage SpeexDSP host dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/speexdsp/include" "$RUNNER_TEMP/speexdsp/lib"
          cp -a /usr/include/speex "$RUNNER_TEMP/speexdsp/include/"
          cp "$(gcc -print-file-name=libspeexdsp.a)" \
            "$RUNNER_TEMP/speexdsp/lib/libspeexdsp.a"

      - name: Verify pinned static Opus development stack
        shell: bash
        run: |
          set -euo pipefail
          # The radiod Ogg Opus decoder is built and tested against the pinned
          # static stack recorded in the Platform tool
          # tools/mt8163-arm32/ui/opus/SOURCE.lock (libogg 1.3.5, opus 1.4,
          # opusfile 0.12). Ubuntu 24.04 ships exactly those upstream versions.
          # Refuse to run the enabled decoder test against anything else, so it
          # is never silently skipped nor rebuilt against a substitute.
          python3 - <<'PY'
          import subprocess, sys
          pins = {"libogg-dev": "1.3.5", "libopus-dev": "1.4", "libopusfile-dev": "0.12"}
          bad = []
          for pkg, pin in pins.items():
              ver = subprocess.run(
                  ["dpkg-query", "-W", "-f", "${Version}", pkg],
                  capture_output=True, text=True, check=True).stdout
              if not ver.startswith(pin):
                  bad.append(f"{pkg}: installed {ver!r} != pinned {pin}")
          for name in ("libopusfile.a", "libopus.a", "libogg.a"):
              path = subprocess.run(
                  ["cc", "-print-file-name", name],
                  capture_output=True, text=True, check=True).stdout.strip()
              if not path.startswith("/"):
                  bad.append(f"static archive not found: {name}")
          if bad:
              print("pinned Opus stack mismatch:", *bad, sep="\n", file=sys.stderr)
              sys.exit(1)
          print("pinned static Opus stack: ok")
          PY

      - name: Verify button settings persistence regression
        shell: bash
        run: |
          set -euo pipefail
          make -j2 SPEEX_PREFIX="$RUNNER_TEMP/speexdsp" build/test-button-settings build/test-buttond-privacy build/test-buttond-events build/libreecho-ledd build/libreecho-buttond
          ./build/test-button-settings
          ./build/test-buttond-privacy
          ./build/test-buttond-events
          sh tests/test_input_capability_state_contract.sh
          sh tests/test_led_pattern_ownership.sh
          python3 tests/test_buttond_led_restart.py

      - name: Verify configuration and mock integration before full suite
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make -j2 SPEEX_PREFIX="$RUNNER_TEMP/speexdsp" all
          ./build/libreecho-web --backend mock --config ./build/preflight-config.json --mock-config ./config/mock-state.json --web-root ./web --listen 127.0.0.1:18082 --seed 42 --dev-controls >./build/preflight-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18082/api/v1/status >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          LIBREECHO_TEST_CONFIG=./build/preflight-config.json sh tests/test_config.sh
          sh tests/test_mock_behaviour.sh

      - name: Run complete UI test suite
        shell: bash
        run: |
          set -euo pipefail
          node --check web/js/app.js
          node --check web/js/integrations-ui.js
          jq -e . web/openapi.json >/dev/null
          make SPEEX_PREFIX="$RUNNER_TEMP/speexdsp" test
          git diff --check

      - name: Set up pinned real-HA Python runtime
        id: ha_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.7'
          update-environment: false

      - name: Install real Home Assistant acceptance dependencies
        shell: bash
        env:
          HA_RUNTIME: ${{ steps.ha_python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$HA_RUNTIME" -m venv "$RUNNER_TEMP/ha-acceptance"
          "$RUNNER_TEMP/ha-acceptance/bin/python" -m pip install \
            -r tests/test_ha_esphome_requirements.txt
          "$RUNNER_TEMP/ha-acceptance/bin/python" -c 'from pathlib import Path; from importlib.metadata import version; rows=[line.split("==", 1) for line in Path("tests/test_ha_esphome_requirements.txt").read_text().splitlines() if line and not line.startswith("#")]; assert all(version(name) == pin for name, pin in rows)'

      - name: Run real Home Assistant ESPHome acceptance
        shell: bash
        env:
          ESPHOME_HA_PYTHON: ${{ runner.temp }}/ha-acceptance/bin/python
        run: |
          set -euo pipefail
          make test-ha-esphome
          git diff --check
