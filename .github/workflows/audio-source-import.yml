name: Exact audio source import
# Temporary transport for reviewed host-tested source. This job creates only
# immutable Git objects; the connected authoring tool updates the feature ref.
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  import:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'hotstage/lived-168'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify and apply exact reviewed source
        env:
          MANIFEST_SHA256: 88dde94e4d3a7d32fa3534396abedbc4b6b49700cef935ec3250921a6934b038
        shell: bash
        run: |
          set -euo pipefail
          echo '77db669f51add4e5c2d1689ae788156db5ff74b2bdf365989ec76963ff73709c  .github/audio-import/import.py' | sha256sum -c -
          cp .github/audio-import/import.py "$RUNNER_TEMP/audio-import.py"
          python3 "$RUNNER_TEMP/audio-import.py" prepare
      - name: Run bounded audio regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 2 120 make -j2 CFLAGS=-O0 test-lived
          timeout -k 2 60 make -j2 CFLAGS=-O0 build/test-cue-rate-limit build/test-action-sample build/libreecho-ttsd
          timeout 15 ./build/test-cue-rate-limit
          timeout 15 ./build/test-action-sample
          timeout 15 sh tests/test_pcm_producer_contract.sh
          python3 -m json.tool web/openapi.json >/dev/null
          git diff --cached --check
      - name: Upload verified immutable source objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/audio-import.py" upload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audio-verified-tree
          path: ${{ runner.temp }}/audio-verified-tree.json
          retention-days: 1
          if-no-files-found: error
