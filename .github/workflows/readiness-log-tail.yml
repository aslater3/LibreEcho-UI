name: Read bounded 0.14 failure evidence
on:
  push:
    branches: ['fix/014-readiness-materialize']
    paths: ['.github/workflows/readiness-log-tail.yml']
permissions:
  actions: read
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read exact completed source-check job log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences /repos/aslater3/LibreEcho-UI/actions/jobs/103163335808/logs > "$RUNNER_TEMP/full-ui-checks.log"
          python3 - <<'PY'
          import os, pathlib, re
          data = pathlib.Path(os.environ['RUNNER_TEMP'], 'full-ui-checks.log').read_text(encoding='utf-8-sig')
          text = '\n'.join(data.splitlines()[-90:])[-16000:]
          print(re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readiness-full-ui-log
          path: ${{ runner.temp }}/full-ui-checks.log
          retention-days: 1
          if-no-files-found: error
