name: Read bounded 0.14 failure evidence
on:
  push:
    branches: ['fix/014-readiness-materialize']
    paths: ['.github/workflows/readiness-log-tail.yml']
permissions:
  actions: read
  contents: read
jobs:
  evidence:
    if: github.repository == 'aslater3/LibreEcho-UI'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read exact completed source-check job log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, urllib.request
          url = 'https://api.github.com/repos/aslater3/LibreEcho-UI/actions/jobs/103163335808/logs'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              data = response.read(2_000_000)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'full-ui-checks.log').write_bytes(data)
          text = '\n'.join(data.decode('utf-8', errors='replace').splitlines()[-100:])[-16000:]
          print(re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readiness-full-ui-log
          path: ${{ runner.temp }}/full-ui-checks.log
          retention-days: 1
          if-no-files-found: error
