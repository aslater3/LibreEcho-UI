# Local speech + LLM backends for the pipeline check (matches the device's protocols).
# Start:   docker compose up -d
# Run:     python3 pipeline.py speech.wav
services:
  whisper:
    image: rhasspy/wyoming-whisper:latest
    command: ["--model", "tiny-int8", "--language", "en"]
    ports: ["10300:10300"]
    volumes: ["whisper-data:/data"]
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama-data:/root/.ollama"]
    # after 'up': docker compose exec ollama ollama pull qwen2.5:0.5b
volumes:
  whisper-data:
  ollama-data:
