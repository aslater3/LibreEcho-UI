// LibreEcho AirPlay 2 output configuration.
general = {
    name = "LibreEcho";
    service_type = "airplay2";
    output_backend = "pipe";
    // The external callback applies sender level through audiod's PCM master.
    // Never attenuate the pipe too, or it would be applied twice.
    ignore_volume_control = "yes";
    run_this_when_volume_is_set = "/usr/local/sbin/libreecho-airplay-audio --set-volume ";
    volume_control_profile = "standard";
};

// Each playback begins with a fresh sender callback. Clear any late callback
// from the previous connection before Shairport starts its player thread;
// wait_for_completion prevents the new callback from racing this cleanup.
// The bridge alone publishes airplay.active after both PCM pipes connect.
sessioncontrol = {
    run_this_before_play_begins = "/usr/local/sbin/libreecho-airplay-audio --start";
    run_this_after_play_ends = "/usr/local/sbin/libreecho-airplay-audio --stop";
    wait_for_completion = "yes";
};

pipe = {
    name = "/run/libreecho/airplay.pcm";
    output_format = "S16_LE";
    output_rate = 48000;
    output_channels = 2;
};

metadata = {
    enabled = "yes";
    include_cover_art = "no";
    cover_art_cache_directory = "";
    pipe_name = "/run/libreecho-audio/airplay.metadata";
};
