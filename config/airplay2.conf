// LibreEcho AirPlay 2 output configuration.
general = {
    name = "LibreEcho";
    service_type = "airplay2";
    output_backend = "pipe";
    run_this_before_entering_active_state = "/usr/local/sbin/libreecho-airplay-audio --start";
    run_this_after_exiting_active_state = "/usr/local/sbin/libreecho-airplay-audio --stop";
    run_this_when_volume_is_set = "/usr/local/sbin/libreecho-airplay-audio --set-volume ";
    volume_control_profile = "standard";
};

pipe = {
    name = "/run/libreecho/airplay.pcm";
    output_format = "S16_LE";
    output_rate = 48000;
    output_channels = 2;
};
