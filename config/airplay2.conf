// LibreEcho AirPlay 2 output configuration.
general = {
    name = "LibreEcho";
    service_type = "airplay2";
    output_backend = "pipe";
    // Sender callbacks set audiod's logical master before DSP on every bus.
    // Keep Shairport's pipe unattenuated to avoid applying sender gain twice.
    ignore_volume_control = "yes";
    run_this_when_volume_is_set = "/usr/local/sbin/libreecho-airplay-audio --set-volume ";
    volume_control_profile = "standard";
};

// Each playback begins with a fresh per-play marker owned by the Platform
// --start/--stop hooks, independent of the persistent bridge FIFO. Clear any
// late callback from the previous connection before Shairport starts its player
// thread; wait_for_completion prevents the new callback from racing cleanup.
sessioncontrol = {
    run_this_before_play_begins = "/usr/local/sbin/libreecho-airplay-audio --start";
    run_this_after_play_ends = "/usr/local/sbin/libreecho-airplay-audio --stop";
    wait_for_completion = "yes";
};

pipe = {
    name = "/run/libreecho/airplay.pcm";
    output_format = "S16_LE";
    output_rate = 48000;
    output_channels = 2;
};

metadata = {
    enabled = "yes";
    include_cover_art = "no";
    cover_art_cache_directory = "";
    pipe_name = "/run/libreecho-audio/airplay.metadata";
};
